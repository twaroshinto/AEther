# AETHER's CI: the engine's tests and the whole firmware in the host simulator, then the real firmware (.fwsc)
# with JieLi's toolchain and SDK, fetched as fm1-base's scripts fetch them.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow numpy
      - run: sh tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: starter-samples
          path: build/test/starter/*.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-results
          path: |
            build/test/*.wav
            app/build/host/*.png
            app/build/host/*.wav

  emulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow numpy
      - uses: mymindstorm/setup-emsdk@v14
      - run: ./build.sh --web
      - uses: actions/upload-artifact@v4
        with:
          name: aether-emulator
          path: |
            app/build/emu/index.html
            app/build/emu/worklet.js
            app/build/emu/app.wasm

  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow numpy
      - uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-v2-${{ hashFiles('base/tools/get_toolchain.sh', 'base/bsp/tools/get_sdk.sh') }}
      - name: JieLi toolchain and AC79 SDK
        run: |
          [ -e ~/.jieli/toolchain/pi32v2/bin/clang ] || sh base/tools/get_toolchain.sh ~/.jieli
          # the AC79 SDK: only the three files the package takes (uboot.boot, cfg_tool.bin, eq_cfg_hw.bin), from
          # JieLi's Gitee repository at the tested tag (tools/build.py checks their SHA-256), else fm1-base's script
          if [ ! -e ~/.jieli/ac79-sdk/cpu/wl82/tools/uboot.boot ]; then
            rm -rf ~/.jieli/ac79-sdk
            git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk &&
              git -C ~/.jieli/ac79-sdk sparse-checkout set --no-cone /LICENSE /cpu/wl82/tools/uboot.boot \
                /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin ||
              { rm -rf ~/.jieli/ac79-sdk; sh base/bsp/tools/get_sdk.sh ~/.jieli/ac79-sdk; }
          fi
          ls -la ~/.jieli/ac79-sdk/cpu/wl82/tools
      - name: Build
        run: |
          export JIELI_TOOLCHAIN=~/.jieli/toolchain AC79_SDK=~/.jieli/ac79-sdk
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
          ~/.jieli/toolchain/common/bin/objdump -t app/build/aether.elf > app/build/aether.syms || true
      - uses: actions/upload-artifact@v4
        with:
          name: aether-firmware
          path: app/build/*.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: aether-firmware-debug
          path: |
            app/build/*.elf
            app/build/*.syms
            app/build/*.dis
          if-no-files-found: ignore
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/*.fwsc

  # the built .fwsc in Joakim Eriksson's FM-1 emulator (an emulation of the chip, not of fm1-base): it boots, a chord
  # is held and the sound must not be silence
  fm1-emu:
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aether-firmware
          path: fw
      - name: fm1-emu
        run: |
          git clone -q https://github.com/joakimeriksson/fm1-emu ~/fm1-emu
          git -C ~/fm1-emu checkout -q db8d472e62f35d18e392e3abc66474daed65ffe9
          cargo build -q --release --manifest-path ~/fm1-emu/Cargo.toml -p fm1-emu
      - uses: actions/download-artifact@v4
        with:
          name: aether-firmware-debug
          path: fw
      - name: Run
        run: |
          mkdir -p out && cd out
          python3 ../tools/emu_diag.py sym ../fw/aether.syms buf_l buf_r eng gain_now | tee syms.txt
          addr() { awk -v n="$1" '$1 == n { print $2 }' syms.txt; }
          size() { awk -v n="$1" '$1 == n { print $3 }' syms.txt; }
          ENG=$(addr eng); ENG_END=$(printf '%x' $(( 0x${ENG#0x} + $(size eng) - 640 )))
          # three runs side by side, each with one --dump at its end: the audio blocks, the engine's start, its end
          run() {   # NAME DUMP_ADDR WORDS
            mkdir -p "$1/work" && (cd "$1" && FM1_AUDIO_TRACE=1 timeout 1500 ~/fm1-emu/target/release/fm1-emu \
              --fwsc ../../fw/aether.fwsc --ms 9000 --wav aether.wav --snap 1500,3000,5000,8000 \
              --keys '2500-8500:C4,2500-8500:E4,2500-8500:G4' --dump "$2" "$3" > run.log 2>&1 || true)
          }
          run blocks "$(addr buf_l)" 512 & run eng "$ENG" 1024 & run engend "$ENG_END" 160 & wait
          grep -vE "^half|^ +0x|^dump" blocks/run.log | tail -45
          python3 ../tools/emu_diag.py lcd blocks/work/lcd_1500.bmp blocks/work/lcd_5000.bmp blocks/work/lcd_8000.bmp || true
          for r in blocks eng engend; do echo "== $r"; python3 ../tools/emu_diag.py dump $r/run.log | head -140; done
          python3 ../tools/wav_level.py blocks/aether.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm1-emu-run
          path: out/
